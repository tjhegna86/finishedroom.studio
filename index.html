<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinishedRoom.Studio</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --charcoal: #3C3C3C;
            --cream: #E8E2D8;
            --sand: #CFC7BC;
            --warm-gray: #A8A29A;
            --gold: #C2A878;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--charcoal);
            font-family: 'Inter', sans-serif;
            line-height: 1.8;
        }

        header {
            padding: 60px 20px;
            text-align: center;
        }

        .logo {
            width: 140px;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 64px;
            font-weight: 300;
            margin: 0;
            line-height: 1.08;
        }

        .tagline {
            font-size: 22px;
            margin-top: 10px;
            font-family: 'Cormorant Garamond', serif;
        }

        .intro {
            max-width: 600px;
            margin: 30px auto;
            font-size: 18px;
        }

        .cta {
            display: inline-block;
            margin-top: 40px;
            padding: 16px 32px;
            background: var(--gold);
            color: white;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-radius: 4px;
            transition: background 0.25s ease;
        }

        .cta:hover {
            background: #B39868;
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 14px;
            color: var(--warm-gray);
        }
    </style>
</head>

<body>

<header>
    <!-- Replace this with your actual logo file -->
    <img src="logo.png" alt="FinishedRoom.Studio Logo" class="logo">

    <h1>FinishedRoom.Studio</h1>
    <div class="tagline">Art that completes the room.</div>

    <p class="intro">
        Curated canvas prints crafted with archival pigment inks, warm editorial aesthetics, and quiet luxury intention. 
        Thoughtfully sized for real homes. Framed. Finished. Delivered.
    </p>

    <a class="cta" href="mailto:finishedroomstudio@gmail.com?subject=Room%20Design%20Order">
        Begin Your Room Design
    </a>
</header>

<footer>
    © 2026 FinishedRoom.Studio — Established 2019
</footer>

</body>
</html>
